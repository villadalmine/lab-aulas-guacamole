global
    log stdout format raw local0
defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h
frontend entrada_tls
    bind :443
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    acl es_lab req.ssl_sni -i localhost
    use_backend caddy_lab if es_lab
    default_backend caddy_lab
backend caddy_lab
    server caddy caddy:443 check
# Sin send-proxy-v2: el Caddy de este ejemplo NO espera PROXY protocol.
