[program:dbus]
command=/usr/bin/dbus-daemon --system --nofork
priority=10
autorestart=true
[program:sshd]
command=/usr/sbin/sshd -D -e
priority=20
autorestart=true
[program:xrdp-sesman]
command=/usr/sbin/xrdp-sesman --nodaemon
priority=30
autorestart=true
[program:xrdp]
command=/usr/sbin/xrdp --nodaemon
priority=40
autorestart=true
