services:
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=7d]
    ports: ['127.0.0.1:19090:9090']
    networks: [backend]
  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    volumes: ['./monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro']
    networks: [backend]
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.2.3}
    environment:
      GF_SECURITY_ADMIN_USER: docente
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/dashboards:/var/lib/grafana/dashboards:ro
    ports: ['127.0.0.1:13000:3000']
    networks: [backend]
volumes:
  prometheus_data:
  grafana_data:
